---
# tasks file for kiosk_mode
- name: Gather facts
  ansible.builtin.setup:

- name: Select kiosk packages for RHEL 9 and newer
  ansible.builtin.set_fact:
    kiosk_packages:
      - gnome-kiosk
      - gnome-kiosk-script-session
    kiosk_script_name: gnome-kiosk-script
  when: ansible_facts['distribution_major_version'] | int >= 9

- name: Ensure hostname set
  ansible.builtin.hostname:
    name: "{{ inventory_hostname.split('.')[0] }}"

- name: Register with RHSM using provided credentials
  community.general.redhat_subscription:
    state: present
    username: "{{ rhsm_username }}"
    password: "{{ rhsm_password }}"
    auto_attach: "{{ rhsm_auto_attach }}"

- name: Install podman for application containers
  ansible.builtin.dnf:
    name: podman
    state: present

- name: Ensure kiosk_mode state directory
  ansible.builtin.file:
    path: "{{ kiosk_state_dir }}"
    state: directory
    mode: "0755"

- name: Check first GUI reboot marker
  ansible.builtin.stat:
    path: "{{ kiosk_first_gui_reboot_marker }}"
  register: kiosk_first_gui_reboot

- name: Set whether RHEL 9+ still needs a first GUI reboot
  ansible.builtin.set_fact:
    kiosk_needs_first_gui_reboot: >-
      {{
        (ansible_facts['distribution_major_version'] | int >= 9)
        and (not kiosk_first_gui_reboot.stat.exists)
        and (kiosk_reboot | bool)
      }}

- name: Measure /boot usage percent
  ansible.builtin.command:
    cmd: df -P /boot
  register: kiosk_boot_df
  changed_when: false

- name: Parse /boot usage percent
  ansible.builtin.set_fact:
    kiosk_boot_usage_percent: >-
      {{
        kiosk_boot_df.stdout_lines[1].split()[4] | regex_replace('%', '') | int
      }}

- name: Set installonly_limit in dnf.conf
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^installonly_limit='
    line: "installonly_limit={{ kiosk_installonly_limit }}"
    insertafter: '^\[main\]'
    mode: "0644"

- name: Remove older installonly packages when /boot is constrained
  ansible.builtin.command:
    cmd: dnf -y remove --oldinstallonly
  register: kiosk_oldinstallonly
  when: kiosk_boot_usage_percent | int >= kiosk_boot_usage_threshold | int
  failed_when:
    - kiosk_oldinstallonly.rc != 0
    - "'No packages' not in (kiosk_oldinstallonly.stdout | default(''))"
    - "'Nothing to do' not in (kiosk_oldinstallonly.stdout | default(''))"
    - "'No match' not in (kiosk_oldinstallonly.stderr | default(''))"
  changed_when: >-
    kiosk_oldinstallonly.rc == 0
    and ('Nothing to do' not in (kiosk_oldinstallonly.stdout | default('')))
    and ('No packages' not in (kiosk_oldinstallonly.stdout | default('')))

- name: Upgrade all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Refresh dnf metadata after system upgrade
  ansible.builtin.command:
    cmd: dnf -y makecache
  changed_when: false

- name: Install Gnome Desktop Environment
  ansible.builtin.dnf:
    name:
      - "@Server With GUI"
    skip_broken: true
    nobest: true
    state: present
  notify: Reboot

- name: Install kiosk session packages
  block:
    - name: Clean stale dnf package cache before kiosk install
      ansible.builtin.command:
        cmd: dnf -y clean packages
      changed_when: false

    - name: Install kiosk session packages with dnf
      ansible.builtin.dnf:
        name: "{{ kiosk_packages + kiosk_runtime_packages }}"
        state: present
        update_cache: true
      notify: Reboot
  rescue:
    - name: Clean dnf package cache after failed kiosk install
      ansible.builtin.command:
        cmd: dnf -y clean packages
      changed_when: false

    - name: Refresh dnf metadata after cache clean
      ansible.builtin.command:
        cmd: dnf -y makecache
      changed_when: false

    - name: Retry kiosk session package install
      ansible.builtin.dnf:
        name: "{{ kiosk_packages + kiosk_runtime_packages }}"
        state: present
      notify: Reboot

- name: Check for split wayland kiosk session desktop file
  ansible.builtin.stat:
    path: /usr/share/wayland-sessions/gnome-kiosk-script-wayland.desktop
  register: kiosk_wayland_session
  when: ansible_facts['distribution_major_version'] | int >= 9

- name: Check for legacy kiosk session desktop file
  ansible.builtin.stat:
    path: /usr/share/wayland-sessions/gnome-kiosk-script.desktop
  register: kiosk_legacy_session
  when: ansible_facts['distribution_major_version'] | int >= 9

- name: Select kiosk session for RHEL 9 and newer
  ansible.builtin.set_fact:
    kiosk_session: >-
      {{
        'gnome-kiosk-script-wayland' if kiosk_wayland_session.stat.exists
        else 'gnome-kiosk-script'
      }}
  when: ansible_facts['distribution_major_version'] | int >= 9

- name: Verify selected kiosk session desktop file exists
  ansible.builtin.stat:
    path: "/usr/share/wayland-sessions/{{ kiosk_session }}.desktop"
  register: kiosk_selected_session
  when: ansible_facts['distribution_major_version'] | int >= 9

- name: Fail when selected kiosk session desktop file is missing
  ansible.builtin.fail:
    msg: >-
      Selected kiosk session '{{ kiosk_session }}' has no desktop file at
      /usr/share/wayland-sessions/{{ kiosk_session }}.desktop.
      Install gnome-kiosk-script-session (or equivalent) before configuring GDM.
  when:
    - ansible_facts['distribution_major_version'] | int >= 9
    - not kiosk_selected_session.stat.exists

- name: Create gdm configuration for kiosk kiosk_mode
  ansible.builtin.template:
    src: custom.conf.j2
    dest: /etc/gdm/custom.conf
    mode: "0644"
  notify: "{{ 'Reboot' if (kiosk_needs_first_gui_reboot | bool) else 'Restart GDM' }}"

- name: Ensure kiosk group exists
  ansible.builtin.group:
    name: kiosk
    gid: 2000
    state: present

- name: Add the user 'kiosk'
  ansible.builtin.user:
    name: kiosk
    comment: kiosk user
    state: present
    shell: /bin/bash
    uid: 2000
    group: kiosk
    groups: users
    create_home: true
    skeleton: true

- name: Check whether kiosk user has a password set
  ansible.builtin.command:
    cmd: passwd -S kiosk
  register: kiosk_password_status
  changed_when: false
  failed_when: kiosk_password_status.rc != 0

- name: Clear kiosk user password for GDM autologin
  ansible.builtin.command:
    cmd: passwd -d kiosk
  register: kiosk_password_clear
  when: kiosk_password_status.stdout.split()[1] != 'NP'
  changed_when: kiosk_password_clear.rc == 0
  failed_when: kiosk_password_clear.rc != 0

- name: Change default target to graphical.target
  ansible.builtin.file:
    src: /usr/lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
  notify: Reboot

- name: Enable and start GDM
  ansible.builtin.systemd:
    name: gdm
    enabled: true
    state: started

- name: Permit traffic in default zone for https service
  ansible.posix.firewalld:
    service: https
    permanent: true
    state: enabled

- name: Create kiosk user directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: kiosk
    group: kiosk
  loop:
    - /home/kiosk/.local/bin
    - /home/kiosk/Desktop
    - /home/kiosk/.config
    - /home/kiosk/.cache
    - /home/kiosk/.mozilla
    - /home/kiosk/.local/state

- name: Disable GNOME initial setup for kiosk user
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: ""
    force: false
    mode: "0644"
    owner: kiosk
    group: kiosk
  loop:
    - /home/kiosk/.config/gnome-initial-setup-done
    - /home/kiosk/.local/state/gnome-initial-setup-done

- name: Disable GNOME initial setup globally
  ansible.builtin.template:
    src: gnome-initial-setup.j2
    dest: /etc/dconf/db/local.d/00-gnome-initial-setup
    mode: "0644"
  register: kiosk_gnome_initial_setup

- name: Apply dconf changes
  ansible.builtin.command:
    cmd: dconf update
  when: kiosk_gnome_initial_setup is changed
  changed_when: true

- name: Remove persisted desktop session overrides for kiosk user
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/kiosk/.dmrc
    - /home/kiosk/.xsession
    - /home/kiosk/.Xclients
    - /home/kiosk/.config/dconf/user

- name: Create shell script to start firefox
  ansible.builtin.template:
    dest: "/home/kiosk/.local/bin/{{ kiosk_script_name }}"
    src: redhat-kiosk.j2
    mode: "0755"
    owner: kiosk
    group: kiosk

- name: Ensure AccountsService kiosk user file exists
  ansible.builtin.copy:
    dest: /var/lib/AccountsService/users/kiosk
    content: |
      [User]
    force: false
    mode: "0600"

- name: Configure AccountsService session keys for kiosk user
  ansible.builtin.lineinfile:
    path: /var/lib/AccountsService/users/kiosk
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    insertafter: '^\[User\]'
    mode: "0600"
  loop:
    - { key: Session, value: "{{ kiosk_session }}" }
    - { key: SystemAccount, value: "false" }
  notify: "{{ 'Reboot' if (kiosk_needs_first_gui_reboot | bool) else 'Restart GDM' }}"

- name: Configure AccountsService XSession for kiosk user on RHEL 8
  ansible.builtin.lineinfile:
    path: /var/lib/AccountsService/users/kiosk
    regexp: '^XSession='
    line: "XSession={{ kiosk_session }}"
    insertafter: '^\[User\]'
    mode: "0600"
  when: ansible_facts['distribution_major_version'] | int < 9
  notify: "{{ 'Reboot' if (kiosk_needs_first_gui_reboot | bool) else 'Restart GDM' }}"

- name: Remove AccountsService XSession override on RHEL 9 and newer
  ansible.builtin.lineinfile:
    path: /var/lib/AccountsService/users/kiosk
    regexp: '^XSession='
    state: absent
  when: ansible_facts['distribution_major_version'] | int >= 9

- name: Ensure kiosk home directory ownership
  ansible.builtin.file:
    path: /home/kiosk
    state: directory
    owner: kiosk
    group: kiosk
    recurse: true

- name: Install kiosk session watchdog script
  ansible.builtin.template:
    src: kiosk-session-watchdog.sh.j2
    dest: /usr/local/libexec/kiosk-session-watchdog
    mode: "0755"
  when: kiosk_session_watchdog | bool

- name: Install kiosk session watchdog unit
  ansible.builtin.template:
    src: kiosk-session-watchdog.service.j2
    dest: /etc/systemd/system/kiosk-session-watchdog.service
    mode: "0644"
  notify: Reload systemd
  when: kiosk_session_watchdog | bool

- name: Install kiosk session watchdog timer
  ansible.builtin.template:
    src: kiosk-session-watchdog.timer.j2
    dest: /etc/systemd/system/kiosk-session-watchdog.timer
    mode: "0644"
  notify: Reload systemd
  when: kiosk_session_watchdog | bool

- name: Enable kiosk session watchdog timer
  ansible.builtin.systemd:
    name: kiosk-session-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
  when: kiosk_session_watchdog | bool

- name: Disable kiosk session watchdog timer when opted out
  ansible.builtin.systemd:
    name: kiosk-session-watchdog.timer
    enabled: false
    state: stopped
  when: not (kiosk_session_watchdog | bool)
  failed_when: false

- name: Force reboot after initial GUI/kiosk setup on RHEL 9+
  ansible.builtin.debug:
    msg: Forcing reboot so GDM autologin can establish the kiosk session
  changed_when: true
  notify: Reboot
  when: kiosk_needs_first_gui_reboot | bool

- name: Ensure Ignition container is running before kiosk session handlers
  ansible.builtin.import_role:
    name: container_lifecycle

- name: Flush handlers (reboot or restart GDM if needed)
  ansible.builtin.meta: flush_handlers

- name: Record successful first GUI reboot on RHEL 9+
  ansible.builtin.copy:
    dest: "{{ kiosk_first_gui_reboot_marker }}"
    content: "completed\n"
    mode: "0644"
    force: false
  when: kiosk_needs_first_gui_reboot | bool
