---
# handlers file for kiosk_mode
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reboot
  ansible.builtin.reboot:
  when: kiosk_reboot | bool

- name: Check whether kiosk Firefox is running
  ansible.builtin.command:
    cmd: pgrep -u kiosk -x firefox
  register: kiosk_has_active_session
  changed_when: false
  failed_when: false
  listen: Restart GDM

- name: Restart GDM
  ansible.builtin.systemd:
    name: gdm
    state: restarted
  when:
    - kiosk_reboot | bool
    - kiosk_has_active_session.rc != 0
  listen: Restart GDM
