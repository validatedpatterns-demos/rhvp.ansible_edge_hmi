---
# defaults file for container_lifecycle

quadlet_units_dir: /etc/containers/systemd/

service_name: inductive-automation-ignition

container_state: installed

container_image: docker.io/inductiveautomation/ignition

container_tag: "8.1"

container_port_mapping: "8088:8088"

container_extra_params: --privileged -e GATEWAY_ADMIN_PASSWORD=redhat

container_healthcheck_cmd: curl -sf --max-time 3 http://localhost:8088/StatusPing

container_healthcheck_interval: 30s

container_healthcheck_retries: 5

container_healthcheck_on_failure: kill

container_healthcheck_start_period: 120s

container_healthcheck_timeout: 5s
